[flake8]
exclude = .git, *migrations*, .tox, dist, htmlcov
max-line-length = 88
select = C,E,F,W,B,B950
ignore = E203, E231, E501, W503, W291, W293

[tox]
envlist = {py38, py39, py310, py311}-django{40}, pylint

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE = testauth.settings.local

deps=
    factory_boy
    django-webtest
    requests-mock
    markdown
    coverage

commands=
    coverage run runtests.py killtracker -v 2
    coverage xml
    coverage report

[testenv:pylint]
deps=
    pylint
    pylint-django
    factory_boy
    django-webtest
    requests-mock
    markdown

commands=
    pylint --load-plugins pylint_django killtracker
